<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css " >
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  
  <title>Advice generator app</title>


</head>
<body>
  
  <mai n class="container">
    <section class="advice-card">

      <p class="advice-id" id="adviceId">
        ADVICE #117
      </p>

      <h1 class="advice-text" id="advice">
        "It is easy to sit up and take notice, What's difficult is getting up and taking action."
      </h1>
      <picture class="divider">
        <img src="images/pattern-divider-desktop.svg" alt="divider">
      </picture>

      <button class="dice-button" id="advice-Button" type="button" aria-label="Generate new advice">
        <img src="images/icon-dice.svg" alt="Generate new advice" class="dice icon">
      </button>

    </section>

  </main>
    
  
  
  
  <script src="app.js"></script>

  
  
</body>
</html>
